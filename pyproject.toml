[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-rail"
version = "0.3.0"
description = "Task flows, scoped decision context and explicit authorization handoffs"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
agentic-rail = "agentic_rail.cli:main"

[tool.setuptools.packages.find]
include = ["agentic_rail*"]

[tool.setuptools.package-data]
agentic_rail = ["assets/*.md", "assets/*.json", "assets/flows/*.md"]
